headersOrigin = "inline"
redirectsOrigin = "inline"

[functions]

[functions."*"]

[[plugins]]
origin = "default"
package = "@netlify/plugin-nextjs"

[plugins.inputs]

[build]
command = "npm install && npm run build"

[build.environment]
NODE_VERSION = "20"

# Block branch deploys and deploy previews from search engines
[context.branch-deploy]
  [context.branch-deploy.environment]
    ROBOTS = "noindex, nofollow"

[context.deploy-preview]
  [context.deploy-preview.environment]
    ROBOTS = "noindex, nofollow"

# Production only - allow indexing
[context.production]
  [context.production.environment]
    ROBOTS = "index, follow"

[[headers]]
for = "/*"

[headers.values]
# HTML always revalidates so deploys and content edits (sold lots, prices) show immediately
Cache-Control = "public, max-age=0, must-revalidate"

# Photos: cache in the browser so navigating the gallery is instant and going
# back to a photo does not re-download it. Fresh for a day, then serve-stale
# while revalidating for a week, so swapped photos still refresh on their own.
[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/_next/image/"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200
force = false

[redirects.query]
url = ":url"
w = ":width"
q = ":quality"

[[redirects]]
from = "/_ipx/*"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200
force = false

[redirects.query]
url = ":url"
w = ":width"
q = ":quality"
